<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>4096 — Ermak X</title>
<script>
(function(){
  try{
    var c=sessionStorage.getItem('ermakx_theme_resolved');
    var r=c||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    document.documentElement.classList.add('theme-'+r);
    document.documentElement.style.background=r==='light'?'#f2f2f7':'#000000';
  }catch(e){}
})();
</script>
<style>html,body{margin:0;height:100%;background:#000;color:#98989f;font:500 14px system-ui,sans-serif}#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<div id="boot">Loading 4096…</div>
<script>
(async function(){
  var urls=[
    'https://cdn.jsdelivr.net/gh/eAI-by-Ermak/Ermak-X@8f5c89e298439acfcde9b9faa12e59dfe3d67ec5/_backup/4096.html',
    'https://raw.githubusercontent.com/eAI-by-Ermak/Ermak-X/8f5c89e298439acfcde9b9faa12e59dfe3d67ec5/_backup/4096.html'
  ];
  var html=null;
  for(var i=0;i<urls.length;i++){
    try{
      var res=await fetch(urls[i]);
      if(res.ok){ html=await res.text(); if(html&&html.indexOf('<html')>=0) break; html=null; }
    }catch(e){}
  }
  if(!html){ document.getElementById('boot').textContent='Could not load game.'; return; }
  html=html.split("new Audio('merge.mp3')").join("new Audio('merge.mp3')");
  html=html.split("new Audio('gameover.mp3')").join("new Audio('gameover.mp3')");
  html=html.split("new Audio('win.mp3')").join("new Audio('merge.mp3')");
  document.open(); document.write(html); document.close();
})();
</script>
</body>
</html>
