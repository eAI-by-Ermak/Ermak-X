<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050508" id="themeColorMeta">
<title>Ermak X</title>
<script>
(function(){
  try{
    var c=null; try{c=sessionStorage.getItem('ermakx_theme_resolved')}catch(e){}
    var r=c||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    document.documentElement.classList.add('theme-'+r);
    var bg=r==='light'?'#e6eef7':'#050508';
    document.documentElement.style.background=bg;
    document.documentElement.style.colorScheme=r;
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="theme.css">
<style>
html,body{height:100%;width:100%;margin:0;padding:0;overflow:hidden;background:var(--bg,#050508)}
body.theme-light,html.theme-light{background:#e6eef7!important}
body.theme-dark,html.theme-dark{background:#050508!important}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent;display:block}
#aiFrame,#notesFrame,#gameFrame{display:none;z-index:20}
#homeFrame{z-index:10}
#backBtn{
  display:none;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:14px;z-index:100;
  width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  cursor:pointer;align-items:center;justify-content:center;padding:0;
}
#boot{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  background:inherit;color:#98989f;font:15px/1.4 -apple-system,system-ui,sans-serif}
</style>
</head>
<body>
<div id="boot">Loading…</div>
<iframe id="homeFrame" src="_backup/index.html" title="Home"></iframe>
<iframe id="aiFrame" src="about:blank" title="AI" allow="clipboard-write"></iframe>
<iframe id="notesFrame" src="about:blank" title="Notes" allow="clipboard-write"></iframe>
<iframe id="gameFrame" src="about:blank" title="4096" allow="clipboard-write"></iframe>
<button id="backBtn" type="button" aria-label="Back">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
</button>
<script>
(function(){
  var home=document.getElementById('homeFrame');
  var ai=document.getElementById('aiFrame');
  var notes=document.getElementById('notesFrame');
  var game=document.getElementById('gameFrame');
  var back=document.getElementById('backBtn');
  var boot=document.getElementById('boot');
  var loaded={ai:false,notes:false,game:false};

  function cleanUrl(){
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  }

  function show(route){
    cleanUrl();
    ai.style.display='none';
    notes.style.display='none';
    game.style.display='none';
    if(route==='home'){
      home.style.display='block';
      back.style.display='none';
      return;
    }
    home.style.display='none';
    back.style.display='flex';
    if(route==='ai'){
      if(!loaded.ai){ ai.src='_backup/ai.html'; loaded.ai=true; }
      ai.style.display='block';
    } else if(route==='notes'){
      if(!loaded.notes){ notes.src='_backup/notes.html'; loaded.notes=true; }
      notes.style.display='block';
    } else if(route==='4096'){
      if(!loaded.game){ game.src='_backup/4096.html'; loaded.game=true; }
      game.style.display='block';
    }
  }

  window.ErmakApp={ show: show };

  home.addEventListener('load', function(){
    if(boot) boot.style.display='none';
    try{
      var w=home.contentWindow;
      if(!w) return;
      w.navigateErmak=function(url){
        var r='home';
        if(url&&String(url).indexOf('ai')>=0) r='ai';
        else if(url&&String(url).indexOf('notes')>=0) r='notes';
        else if(url&&String(url).indexOf('4096')>=0) r='4096';
        show(r);
      };
      w.ErmakApp={ show: show };
    }catch(e){}
  });

  back.onclick=function(){ show('home'); };

  // theme sync from home iframe when ready
  try{
    var resolved=sessionStorage.getItem('ermakx_theme_resolved');
    if(resolved){
      document.body.classList.add('theme-'+resolved);
      document.documentElement.classList.add('theme-'+resolved);
    }
  }catch(e){}
})();
</script>
<script src="theme.js" defer></script>
</body>
</html>
