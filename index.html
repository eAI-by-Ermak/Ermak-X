<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050508" id="themeColorMeta">
<title>Ermak X</title>
<script>
(function(){
  try{
    var c=null; try{c=sessionStorage.getItem('ermakx_theme_resolved')}catch(e){}
    var r=c||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    document.documentElement.classList.add('theme-'+r);
    document.documentElement.style.background=r==='light'?'#e6eef7':'#050508';
    document.documentElement.style.colorScheme=r;
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="css/spa.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%231c1c1e' d='M8 6h3.2l4.8 12.5L20.8 6H24v20h-3.2V12.2L16 24h-1.6L9.6 12.2V26H6.4V6z'/%3E%3C/svg%3E">
<style>
html,body{height:100%;width:100%;margin:0;padding:0;overflow:hidden;background:#050508}
html.theme-light{background:#e6eef7!important}
#boot{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;gap:10px;
  background:inherit;color:#98989f;font:500 15px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  transition:opacity .4s cubic-bezier(.22,1,.36,1);
}
#boot.is-gone{opacity:0;pointer-events:none}
#boot .dot{
  width:8px;height:8px;border-radius:50%;background:#ff3b30;
  animation:pulse 1s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
</style>
</head>
<body>
<div id="boot"><span class="dot"></span>Ermak X</div>
<div id="spaVeil"></div>

<iframe id="frame-home" class="spa-frame is-home is-active" src="_backup/index.html" title="Home"></iframe>
<iframe id="frame-ai" class="spa-frame" src="about:blank" title="AI" allow="clipboard-write"></iframe>
<iframe id="frame-notes" class="spa-frame" src="about:blank" title="Notes" allow="clipboard-write"></iframe>
<iframe id="frame-4096" class="spa-frame" src="about:blank" title="4096" allow="clipboard-write"></iframe>

<script src="js/app.js"></script>
<script src="theme.js" defer></script>
</body>
</html>
