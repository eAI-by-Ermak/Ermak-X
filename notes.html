<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050508">
<title>Ermak X — Notes</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%231c1c1e' d='M8 6h3.2l4.8 12.5L20.8 6H24v20h-3.2V12.2L16 24h-1.6L9.6 12.2V26H6.4V6z'/%3E%3C/svg%3E">
<script>
(function(){
  try{
    var c=null; try{c=sessionStorage.getItem('ermakx_theme_resolved')}catch(e){}
    var r=c||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    document.documentElement.classList.add('theme-'+r);
    document.documentElement.style.background=r==='light'?'#e6eef7':'#050508';
  }catch(e){}
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif}
html{background:#e6eef7}html.theme-dark{background:#050508!important}
body{background:var(--bg);color:var(--text);transition:background .25s,color .25s}
body.theme-dark{
  --bg:#000;--text:#f5f5f7;--text2:#98989f;--surface:rgba(28,10,10,.55);
  --border:rgba(255,59,48,.2);--accent:#ff3b30;--item:rgba(255,255,255,.05);
  --glass:rgba(18,6,6,.6);--input:rgba(255,255,255,.06);
}
body.theme-light{
  --bg:#f2f2f7;--text:#1c1c1e;--text2:#6c6c70;--surface:rgba(255,255,255,.75);
  --border:rgba(0,0,0,.08);--accent:#ff3b30;--item:rgba(0,0,0,.04);
  --glass:rgba(255,255,255,.7);--input:#fff;
}
.home-btn{
  position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:50;
  width:42px;height:42px;border-radius:14px;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:var(--surface);color:var(--text);
  backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);
}
.home-btn:active{transform:scale(.92)}
.home-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px))}
.head{display:flex;align-items:center;justify-content:space-between;padding:4px 48px 12px 4px;gap:10px}
.head h1{font-size:26px;font-weight:750;letter-spacing:-.03em}
.head h1 span{color:var(--accent)}
.add-btn{
  border:none;background:var(--accent);color:#fff;border-radius:14px;padding:10px 14px;
  font:inherit;font-size:13px;font-weight:650;cursor:pointer;box-shadow:0 6px 18px rgba(255,59,48,.3);
}
.add-btn:active{transform:scale(.96)}
.search{
  width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--border);
  background:var(--glass);color:var(--text);font:inherit;font-size:15px;outline:none;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.search::placeholder{color:var(--text2)}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:12px 0;margin:0 -2px;padding-right:2px}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 16px;
  cursor:pointer;transition:transform .15s;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.card:active{transform:scale(.98)}
.card-title{font-size:16px;font-weight:650;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-preview{font-size:13px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-date{font-size:11px;color:var(--text2);margin-top:8px;opacity:.8}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text2);gap:8px;text-align:center;padding:40px 20px}
.empty-title{font-size:18px;font-weight:650;color:var(--text)}
.editor{
  position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px));
}
.editor.on{display:flex}
.ed-bar{display:flex;gap:8px;margin-bottom:12px}
.ed-bar button{
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:14px;padding:10px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
}
.ed-bar button.primary{background:var(--accent);color:#fff;border:none;box-shadow:0 6px 18px rgba(255,59,48,.3)}
.ed-title{
  width:100%;border:none;background:transparent;color:var(--text);font:inherit;font-size:22px;font-weight:700;
  outline:none;padding:8px 0;letter-spacing:-.02em;
}
.ed-body{
  flex:1;width:100%;border:none;background:transparent;color:var(--text);font:inherit;font-size:16px;
  outline:none;resize:none;line-height:1.5;padding:8px 0;
}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="app">
  <div class="head">
    <h1>Notes <span>·</span></h1>
    <button class="add-btn" id="addBtn">+ New</button>
  </div>
  <input class="search" id="search" placeholder="Search notes…" type="search">
  <div class="list" id="list"></div>
  <div class="empty" id="empty" style="display:none">
    <div class="empty-title">No notes yet</div>
    <div>Tap + New to create one</div>
  </div>
</div>
<button class="home-btn" id="homeBtn" title="Home" aria-label="Home">
  <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
</button>
<div class="editor" id="editor">
  <div class="ed-bar">
    <button id="edBack">← Back</button>
    <button class="primary" id="edSave">Save</button>
    <button id="edDel" style="margin-left:auto;color:var(--accent)">Delete</button>
  </div>
  <input class="ed-title" id="edTitle" placeholder="Title">
  <textarea class="ed-body" id="edBody" placeholder="Write something…"></textarea>
</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  let notes = [];
  let editing = null;
  try { notes = JSON.parse(localStorage.getItem('ermakx_notes') || '[]'); } catch(e){}

  function save(){ localStorage.setItem('ermakx_notes', JSON.stringify(notes)); }
  function render(filter=''){
    const q = filter.trim().toLowerCase();
    const list = $('list');
    list.innerHTML = '';
    const filtered = notes.filter(n => !q || (n.title||'').toLowerCase().includes(q) || (n.body||'').toLowerCase().includes(q));
    $('empty').style.display = filtered.length ? 'none' : 'flex';
    filtered.sort((a,b)=>(b.updated||0)-(a.updated||0)).forEach(n => {
      const d = document.createElement('div');
      d.className = 'card';
      d.innerHTML = `<div class="card-title">${esc(n.title||'Untitled')}</div>
        <div class="card-preview">${esc((n.body||'').slice(0,120))}</div>
        <div class="card-date">${fmt(n.updated)}</div>`;
      d.onclick = () => open(n.id);
      list.appendChild(d);
    });
  }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmt(t){ if(!t) return ''; const d=new Date(t); return d.toLocaleDateString()+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
  function open(id){
    editing = notes.find(n=>n.id===id) || null;
    if(!editing) return;
    $('edTitle').value = editing.title||'';
    $('edBody').value = editing.body||'';
    $('editor').classList.add('on');
  }
  function close(){ $('editor').classList.remove('on'); editing=null; }
  $('addBtn').onclick = () => {
    const id = Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    const n = {id, title:'', body:'', updated:Date.now()};
    notes.push(n); save(); open(id);
  };
  $('edBack').onclick = () => { close(); render($('search').value); };
  $('edSave').onclick = () => {
    if(!editing) return;
    editing.title = $('edTitle').value;
    editing.body = $('edBody').value;
    editing.updated = Date.now();
    save(); close(); render($('search').value);
  };
  $('edDel').onclick = () => {
    if(!editing || !confirm('Delete this note?')) return;
    notes = notes.filter(n=>n.id!==editing.id);
    save(); close(); render($('search').value);
  };
  $('search').oninput = () => render($('search').value);
  $('homeBtn').onclick = () => location.href = 'index.html';
  render();

  try{
    var resolved = sessionStorage.getItem('ermakx_theme_resolved') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    document.documentElement.classList.add('theme-'+resolved);
    document.body.classList.add('theme-'+resolved);
    document.documentElement.style.background=resolved==='light'?'#e6eef7':'#050508';
    var meta=document.querySelector('meta[name="theme-color"]');
    if(meta) meta.content=resolved==='light'?'#e6eef7':'#050508';
  }catch(e){}
})();
</script>
<script src="theme.js" defer></script>
</body>
</html>
