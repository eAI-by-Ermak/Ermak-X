<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Ermak X</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%231c1c1e' d='M8 6h3.2l4.8 12.5L20.8 6H24v20h-3.2V12.2L16 24h-1.6L9.6 12.2V26H6.4V6z'/%3E%3C/svg%3E">
<script>
(function(){
  try{
    var c=null; try{c=sessionStorage.getItem('ermakx_theme_resolved')}catch(e){}
    var r=c||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    document.documentElement.classList.add('theme-'+r);
    document.documentElement.style.background=r==='light'?'#f2f2f7':'#000000';
  }catch(e){}
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif}
html{background:#f2f2f7}html.theme-dark{background:#000!important}
body{background:var(--bg);color:var(--text);transition:background .25s,color .25s}
body.theme-dark{
  --bg:#000;--text:#f5f5f7;--text2:#98989f;--surface:rgba(28,10,10,.55);
  --border:rgba(255,59,48,.2);--accent:#ff3b30;--item:rgba(255,255,255,.05);
  --glass:rgba(18,6,6,.6);--input:rgba(255,255,255,.06);
}
body.theme-light{
  --bg:#f2f2f7;--text:#1c1c1e;--text2:#6c6c70;--surface:rgba(255,255,255,.75);
  --border:rgba(0,0,0,.08);--accent:#ff3b30;--item:rgba(0,0,0,.04);
  --glass:rgba(255,255,255,.7);--input:#fff;
}
.home-btn{
  position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:50;
  width:42px;height:42px;border-radius:14px;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:var(--surface);color:var(--text);
  backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);
}
.home-btn:active{transform:scale(.92)}
.home-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px))}
.head{display:flex;align-items:center;justify-content:space-between;padding:4px 48px 12px 4px;gap:10px}
.head h1{font-size:26px;font-weight:750;letter-spacing:-.03em}
.head h1 span{color:var(--accent)}
.add-btn{
  border:none;background:var(--accent);color:#fff;border-radius:14px;padding:10px 14px;
  font:inherit;font-size:13px;font-weight:650;cursor:pointer;box-shadow:0 6px 18px rgba(255,59,48,.3);
}
.add-btn:active{transform:scale(.96)}
.search{
  width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--border);
  background:var(--glass);color:var(--text);font:inherit;font-size:14px;margin-bottom:12px;
  backdrop-filter:blur(20px);outline:none;
}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.card{
  text-align:left;width:100%;padding:14px 16px;border-radius:18px;border:1px solid var(--border);
  background:var(--glass);color:var(--text);font:inherit;cursor:pointer;
  backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);
  box-shadow:0 4px 16px rgba(0,0,0,.05);
}
.card:active{transform:scale(.985)}
.card .title{font-size:15px;font-weight:650;margin-bottom:4px}
.card .preview{font-size:13px;color:var(--text2);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:11px;color:var(--text2);margin-top:8px}
.empty{text-align:center;color:var(--text2);padding:48px 16px;font-size:14px}
.editor{
  position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px));
  max-width:560px;margin:0 auto;left:0;right:0;
}
.editor.on{display:flex}
.ed-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ed-bar button{
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:12px;padding:9px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
}
.ed-bar button.primary{background:var(--accent);color:#fff;border:none}
.ed-bar button.danger{color:var(--accent)}
.ed-bar .spacer{flex:1}
.ed-title{
  width:100%;padding:12px 4px;border:none;border-bottom:1px solid var(--border);
  background:transparent;color:var(--text);font:inherit;font-size:20px;font-weight:700;outline:none;margin-bottom:10px;
}
.ed-body{
  flex:1;width:100%;border:none;background:transparent;color:var(--text);font:inherit;font-size:16px;
  line-height:1.55;outline:none;resize:none;
}
@media(min-width:700px){
  .app,.editor{max-width:640px}
  .list{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
  .empty{grid-column:1/-1}
}
</style>
</head>
<body class="theme-dark">
<button class="home-btn" id="homeBtn" title="Home" aria-label="Home">
  <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
</button>
<div class="app">
  <div class="head">
    <h1>Notes<span>.</span></h1>
    <button type="button" class="add-btn" id="addBtn">New note</button>
  </div>
  <input class="search" id="search" type="search" placeholder="Search notes…" autocomplete="off">
  <div class="list" id="list"><div class="empty">Loading…</div></div>
</div>
<div class="editor" id="editor">
  <div class="ed-bar">
    <button type="button" id="backBtn">Back</button>
    <div class="spacer"></div>
    <button type="button" class="danger" id="delBtn">Delete</button>
    <button type="button" class="primary" id="saveBtn">Save</button>
  </div>
  <input class="ed-title" id="edTitle" placeholder="Title" maxlength="120">
  <textarea class="ed-body" id="edBody" placeholder="Write something…"></textarea>
</div>
<script>
const DB_NAME='ermakx', DB_VER=2;
let _db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=()=>{const db=r.result; if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv')};
    r.onsuccess=()=>{_db=r.result; res(_db)};
    r.onerror=()=>rej(r.error);
  });
}
function idbGet(key){
  return openDB().then(db=>new Promise((res,rej)=>{
    const q=db.transaction('kv','readonly').objectStore('kv').get(key);
    q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);
  }));
}
function idbSet(key,val){
  return openDB().then(db=>new Promise((res,rej)=>{
    const q=db.transaction('kv','readwrite').objectStore('kv').put(val,key);
    q.onsuccess=()=>res(); q.onerror=()=>rej(q.error);
  }));
}
function navigateErmak(url){
  try{
    const ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;z-index:99999;opacity:0;transition:opacity .28s ease;pointer-events:all';
    ov.style.background=getComputedStyle(document.body).backgroundColor||'#000';
    document.body.appendChild(ov);
    requestAnimationFrame(()=>{ov.style.opacity='1'});
    setTimeout(()=>{location.href=url},280);
  }catch(e){location.href=url}
}
function uid(){return 'n_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

let notes=[];
let editingId=null;

async function loadTheme(){
  let theme='system';
  try{const s=await idbGet('ermakx_settings'); if(s&&s.theme) theme=s.theme}catch(e){}
  let resolved=theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):theme;
  try{const c=sessionStorage.getItem('ermakx_theme_resolved'); if(c) resolved=c}catch(e){}
  document.body.classList.remove('theme-dark','theme-light');
  document.body.classList.add('theme-'+resolved);
  document.documentElement.classList.remove('theme-dark','theme-light');
  document.documentElement.classList.add('theme-'+resolved);
  document.documentElement.style.background=resolved==='light'?'#f2f2f7':'#000000';
  try{sessionStorage.setItem('ermakx_theme_resolved',resolved)}catch(e){}
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content=resolved==='light'?'#f2f2f7':'#000000';
}

async function loadNotes(){
  try{
    const v=await idbGet('ermakx_notes');
    notes=Array.isArray(v)?v:[];
  }catch(e){ notes=[] }
}
async function saveNotes(){
  try{ await idbSet('ermakx_notes', notes); }catch(e){}
}

function fmtDate(iso){
  try{
    const d=new Date(iso);
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  }catch(e){return ''}
}

function filtered(){
  const q=(document.getElementById('search').value||'').trim().toLowerCase();
  let list=notes.slice().sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  if(q) list=list.filter(n=>(n.title||'').toLowerCase().includes(q)||(n.body||'').toLowerCase().includes(q));
  return list;
}

function renderList(){
  const list=document.getElementById('list');
  const items=filtered();
  if(!items.length){
    list.innerHTML='<div class="empty">'+(notes.length?'No matches':'No notes yet.<br>Tap New note to start.')+'</div>';
    return;
  }
  list.innerHTML=items.map(n=>{
    const prev=(n.body||'').replace(/\s+/g,' ').trim().slice(0,140);
    return '<button type="button" class="card" data-id="'+n.id+'"><div class="title">'+esc(n.title||'Untitled')+'</div>'
      +(prev?'<div class="preview">'+esc(prev)+'</div>':'')
      +'<div class="meta">'+esc(fmtDate(n.updatedAt||n.createdAt))+'</div></button>';
  }).join('');
  list.querySelectorAll('.card').forEach(btn=>{
    btn.addEventListener('click',()=>openEditor(btn.getAttribute('data-id')));
  });
}

function openEditor(id){
  editingId=id||null;
  let n=id?notes.find(x=>x.id===id):null;
  if(!n && id){ editingId=null; n=null; }
  document.getElementById('edTitle').value=n? (n.title||'') : '';
  document.getElementById('edBody').value=n? (n.body||'') : '';
  document.getElementById('delBtn').style.display=n?'':'none';
  document.getElementById('editor').classList.add('on');
  setTimeout(()=>document.getElementById(n?'edBody':'edTitle').focus(),50);
}

function closeEditor(){
  document.getElementById('editor').classList.remove('on');
  editingId=null;
  renderList();
}

async function saveCurrent(){
  const title=(document.getElementById('edTitle').value||'').trim();
  const body=(document.getElementById('edBody').value||'').trim();
  if(!title && !body){ closeEditor(); return; }
  const now=new Date().toISOString();
  if(editingId){
    const n=notes.find(x=>x.id===editingId);
    if(n){ n.title=title||'Untitled'; n.body=body; n.updatedAt=now; }
  }else{
    notes.unshift({id:uid(),title:title||'Untitled',body:body,createdAt:now,updatedAt:now});
  }
  await saveNotes();
  closeEditor();
}

async function deleteCurrent(){
  if(!editingId) return;
  if(!confirm('Delete this note?')) return;
  notes=notes.filter(n=>n.id!==editingId);
  await saveNotes();
  closeEditor();
}

async function init(){
  await loadTheme();
  await loadNotes();
  renderList();
  document.getElementById('homeBtn').addEventListener('click',()=>navigateErmak('index.html'));
  document.getElementById('addBtn').addEventListener('click',()=>openEditor(null));
  document.getElementById('backBtn').addEventListener('click',()=>{
    // auto-save on back if content exists
    const title=(document.getElementById('edTitle').value||'').trim();
    const body=(document.getElementById('edBody').value||'').trim();
    if(title||body) saveCurrent(); else closeEditor();
  });
  document.getElementById('saveBtn').addEventListener('click',saveCurrent);
  document.getElementById('delBtn').addEventListener('click',deleteCurrent);
  document.getElementById('search').addEventListener('input',renderList);
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
